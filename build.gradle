plugins {
	id 'fabric-loom' version '1.13.6'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
}

loom {
	accessWidenerPath = file('src/main/resources/seedxray.accesswidener')
	runs {
		client {
			// ./gradlew runClient -PquickPlay=localhost:25565 joins a server straight away (handy for testing)
			if (project.hasProperty('quickPlay')) {
				programArgs '--quickPlayMultiplayer', project.property('quickPlay')
			}
			if (project.hasProperty('quickPlaySingle')) {
				programArgs '--quickPlaySingleplayer', project.property('quickPlaySingle')
			}
			programArgs '--username', 'SeedXrayDev'
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation platform('org.junit:junit-bom:5.10.2')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
	inputs.property 'version', project.version
	filesMatching('fabric.mod.json') {
		expand 'version': project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	options.release = 21
	options.encoding = 'UTF-8'
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

test {
	useJUnitPlatform()
	testLogging.showStandardStreams = false
	System.properties.each { k, v -> if (k.toString().startsWith('seedxray.')) systemProperty k.toString(), v }
}

jar {
	from('LICENSE') { rename { "${it}_${project.base.archivesName.get()}" } }
}
